name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-20
            args: -d project_name=ci-default
          - name: full-16
            args: >-
              -d project_name=ci-full -d odoo_version=16.0 -d use_queue_job=true
              -d custom_repo_pattern=git@github.com:acme/{}.git
              -d custom_repo_name=acme-addons
              -d module_prefix=acme -d ticket_prefix=ACME -d extra_ticket_prefixes=AI
              -d status_mcp=teams -d tickets_mcp=odoo
              -d odoo_prod_url=https://odoo.example.com -d use_pipeline=true -d use_entire=true
              -d use_antigravity=true
              -d backup_s3_bucket=acme-backups -d editor=vscode
              -d prod_ssh_host=203.0.113.1 -d prod_web_url=https://odoo.example.com
              -d prod_local_ssh_host=10.0.0.5
              -d 'test_ssh_hosts={test: 203.0.113.2, test2: 203.0.113.3}'
          - name: no-claude-18
            args: >-
              -d project_name=ci-plain -d odoo_version=18.0
              -d use_claude_code=false
          - name: repo-no-s3-17
            args: >-
              -d project_name=ci-repo -d odoo_version=17.0
              -d custom_repo_pattern=git@github.com:acme/{}.git
              -d custom_repo_name=acme-addons
          - name: agy-only-17
            args: >-
              -d project_name=ci-agy -d odoo_version=17.0
              -d use_claude_code=false -d use_antigravity=true
              -d custom_repo_pattern=git@github.com:acme/{}.git
              -d custom_repo_name=acme-addons -d use_kb=true
          - name: py314-19
            args: >-
              -d project_name=ci-nineteen -d odoo_version=19.0
              -d python_version=3.14 -d postgres_version=18 -d use_queue_job=true
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Generate project
        run: uvx copier copy --trust --defaults --vcs-ref=HEAD ${{ matrix.args }} . /tmp/gen
      - name: Bash syntax check
        run: |
          shopt -s globstar nullglob
          for f in /tmp/gen/nix/scripts/*.sh /tmp/gen/.claude/hooks/*.sh /tmp/gen/.claude/skills/**/scripts/*.sh /tmp/gen/.agents/hooks/*.sh; do
            bash -n "$f"
          done
      - name: Antigravity layer (JSON parses, adapter corpus)
        run: |
          shopt -s nullglob
          for f in /tmp/gen/.agents/*.json /tmp/gen/.agents/plugins/*/*.json /tmp/gen/.agents/plugins/*/sidecars/*/*.json; do python3 -m json.tool "$f" > /dev/null; done
          python3 tests/test_antigravity_hook.py
      - name: Mods' tests (claude plugin test)
        env:
          # the binary is the test kit (claude-code/testing): bump it on purpose, not by drift
          CLAUDE_CODE_VERSION: 2.1.299
        run: |
          shopt -s nullglob
          mods=(/tmp/gen/.claude/skills/*/.claude-plugin)
          if [ ${#mods[@]} -eq 0 ]; then echo "no mods in this render"; exit 0; fi
          base=https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION
          curl -fsSL "$base/linux-x64/claude" -o /tmp/claude
          echo "$(curl -fsSL "$base/manifest.json" | jq -r '.platforms["linux-x64"].checksum')  /tmp/claude" | sha256sum -c -
          chmod +x /tmp/claude
          rc=0
          for m in "${mods[@]}"; do
            mod=$(dirname "$m")
            echo "::group::${mod##*/}"
            (cd "$mod" && /tmp/claude plugin test .) || { rc=1; echo "::error::${mod##*/}: tests failed"; }
            echo "::endgroup::"
          done
          exit $rc
      - name: nix flake check
        run: |
          cd /tmp/gen
          git add -A
          git -c user.email=ci@ci -c user.name=ci commit -qm init
          nix flake check
